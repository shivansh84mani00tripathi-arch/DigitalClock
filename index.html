<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#050505"><title>Premanand Digital Clock</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050505;color:#fff;font-family:Arial,sans-serif}
#bg{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;z-index:0}.shade{position:fixed;inset:0;background:linear-gradient(90deg,#0008,#0002,#0008);z-index:1}
#sky{position:fixed;right:6%;top:7%;width:90px;height:90px;border-radius:50%;z-index:4;opacity:0;transition:opacity 1.5s,transform 2s;pointer-events:none}.sun{background:radial-gradient(circle,#fff4a0,#ffd34d 45%,#ff9b1a 70%,transparent 72%);filter:drop-shadow(0 0 25px #ffc84a);animation:pulse 4s infinite}.moon{background:radial-gradient(circle at 50% 50%,#fff,#ddd 70%);filter:drop-shadow(0 0 20px #dde7ff)}.moon:after{content:"";position:absolute;background:#050505;width:100%;height:100%;border-radius:50%;left:-28%;top:-8%}@keyframes pulse{50%{transform:scale(1.08)}}
main{position:relative;z-index:3;height:100%;display:flex;align-items:center;justify-content:center;text-align:center}.panel{width:92vw;max-width:1050px}.title{font-size:clamp(12px,2vw,20px);letter-spacing:6px;font-weight:700;margin-bottom:12px;text-shadow:0 2px 15px #000}.time{display:flex;justify-content:center;align-items:center;gap:8px}.group{display:flex;gap:5px}.digit{width:clamp(38px,7.5vw,95px);height:clamp(58px,14vh,125px);display:grid;place-items:center;font-size:clamp(45px,12vh,112px);font-weight:800;line-height:1;background:#0002;border-radius:10px;text-shadow:0 3px 22px #000;overflow:hidden}.sep{font-size:clamp(48px,12vh,120px);font-weight:800}.flip{animation:up .38s cubic-bezier(.2,.7,.3,1)}@keyframes up{0%{transform:translateY(60%);opacity:0}60%{transform:translateY(-7%);opacity:1}100%{transform:translateY(0)}}.ampm{font-size:clamp(16px,3vh,28px);letter-spacing:4px;font-weight:700;margin-top:8px;text-shadow:0 2px 14px #000}.date{font-size:clamp(16px,3.2vh,27px);font-weight:600;margin-top:13px;text-shadow:0 2px 14px #000}.day{font-size:clamp(20px,4vh,34px);font-weight:800;margin-top:3px;text-shadow:0 2px 14px #000}.zone{font-size:11px;letter-spacing:4px;margin-top:8px;text-shadow:0 2px 10px #000}.buttons{position:fixed;z-index:5;bottom:9px;left:50%;transform:translateX(-50%);display:flex;gap:8px}button{color:#fff;background:#0007;border:1px solid #fff5;border-radius:22px;padding:8px 14px;font-size:14px;backdrop-filter:blur(8px)}
@media(orientation:portrait){.digit{width:9vw;height:10vw;font-size:10vw}.sep{font-size:9vw}.group{gap:2px}.time{gap:2px}}@media(orientation:landscape){.buttons{bottom:6px}}
</style></head><body><img id="bg" src="wallpaper.jpg"><div class="shade"></div><div id="sky"></div><main><section class="panel"><div class="title"><span id="icon">☀</span> LIVE DIGITAL CLOCK</div><div class="time"><div class="group" id="h"></div><div class="sep">:</div><div class="group" id="m"></div><div class="sep">:</div><div class="group" id="s"></div></div><div class="ampm" id="ap"></div><div class="date" id="date"></div><div class="day" id="day"></div><div class="zone">INDIA • IST</div></section></main><div class="buttons"><button id="full">⛶ Fullscreen</button><button id="awake">☀ Keep Awake</button></div>
<script>
let last={h:"",m:"",s:""};const q=x=>document.getElementById(x);
function group(el,v,old){el.innerHTML=[...v].map((x,i)=>'<span class="digit '+(v[i]!==old[i]?'flip':'')+'">'+x+'</span>').join('')}
function update(){let n=new Date(),H=n.getHours(),M=n.getMinutes(),S=n.getSeconds(),ap=H>=12?'PM':'AM';H=H%12||12;let h=String(H).padStart(2,'0'),m=String(M).padStart(2,'0'),s=String(S).padStart(2,'0');group(q('h'),h,last.h);group(q('m'),m,last.m);group(q('s'),s,last.s);last={h,m,s};q('ap').textContent=ap;q('date').textContent=n.toLocaleDateString('en-IN',{day:'numeric',month:'long',year:'numeric'});q('day').textContent=n.toLocaleDateString('en-IN',{weekday:'long'});let t=n.getHours()+n.getMinutes()/60,sky=q('sky');if(t>=5&&t<7){sky.className='sun';sky.style.opacity=1;q('icon').textContent='☼'}else if(t<17){sky.className='sun';sky.style.opacity=1;q('icon').textContent='☀'}else if(t<19.5){sky.className='sun';sky.style.opacity=.6;q('icon').textContent='◒'}else{sky.className='moon';sky.style.opacity=1;q('icon').textContent='☾'}}
function tick(){update();setTimeout(tick,1005-Date.now()%1000)}tick();
q('full').onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen?.();let lock;q('awake').onclick=async()=>{try{lock=await navigator.wakeLock.request('screen');q('awake').textContent='✓ Keep Awake'}catch(e){}};
</script></body></html>
