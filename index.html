<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#050505">
<title>Premanand Digital Clock</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050505;color:#fff;font-family:Arial,sans-serif}
#bg{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;z-index:0;transition:opacity .7s}
.shade{position:fixed;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.65),rgba(0,0,0,.18),rgba(0,0,0,.65));z-index:1}
#sky{position:fixed;right:6%;top:7%;width:clamp(65px,9vw,110px);height:clamp(65px,9vw,110px);border-radius:50%;z-index:4;opacity:0;transition:opacity 1.2s;pointer-events:none}
.sun{background:radial-gradient(circle at 38% 35%,#fff8bd 0 7%,#ffe45c 35%,#ffad20 68%,transparent 72%);filter:drop-shadow(0 0 28px #ffc94a);animation:pulse 4s ease-in-out infinite}
.moon{background:radial-gradient(circle,#fff,#d8d8d0 75%);filter:drop-shadow(0 0 20px rgba(225,235,255,.8))}
.moon:after{content:"";position:absolute;width:100%;height:100%;border-radius:50%;background:#070707;left:-27%;top:-9%}
@keyframes pulse{50%{transform:scale(1.08)}}
main{position:relative;z-index:3;width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center}
.panel{width:min(94vw,1100px)}.title{font-size:clamp(12px,2vw,20px);letter-spacing:6px;font-weight:700;margin-bottom:13px;text-shadow:0 3px 18px #000}
.time{display:flex;align-items:center;justify-content:center;gap:clamp(3px,.8vw,10px);perspective:900px}.group{display:flex;gap:clamp(2px,.45vw,7px)}
.sep{font-size:clamp(45px,12vh,115px);font-weight:800;line-height:1;text-shadow:0 4px 20px #000}
.digit{position:relative;width:clamp(40px,7.5vw,96px);height:clamp(60px,14vh,126px);display:grid;place-items:center;overflow:hidden;font-size:clamp(46px,12vh,112px);font-weight:800;line-height:1;border-radius:9px;background:linear-gradient(180deg,#181818,#080808);border:1px solid rgba(255,255,255,.16);box-shadow:0 9px 22px rgba(0,0,0,.6),inset 0 1px rgba(255,255,255,.1);text-shadow:0 3px 18px #000;transform-style:preserve-3d}
.digit:before{content:"";position:absolute;left:0;right:0;top:50%;height:2px;background:rgba(255,255,255,.17);box-shadow:0 1px 0 #000;z-index:3}
.flip{animation:paperTurn .68s cubic-bezier(.18,.72,.18,1)}
@keyframes paperTurn{0%{transform:rotateX(0);filter:brightness(1)}18%{transform:rotateX(-38deg);filter:brightness(.88)}42%{transform:rotateX(-88deg);filter:brightness(.55)}58%{transform:rotateX(-112deg);filter:brightness(.42)}78%{transform:rotateX(-45deg);filter:brightness(.82)}100%{transform:rotateX(0);filter:brightness(1)}}
.ampm{font-size:clamp(15px,3vh,28px);letter-spacing:4px;font-weight:700;margin-top:9px;text-shadow:0 3px 16px #000}.date{font-size:clamp(15px,3.2vh,27px);font-weight:600;margin-top:14px;text-shadow:0 3px 16px #000}.day{font-size:clamp(19px,4vh,35px);font-weight:800;margin-top:3px;text-shadow:0 3px 16px #000}.zone{font-size:11px;letter-spacing:4px;margin-top:8px;text-shadow:0 2px 12px #000;opacity:.9}
.buttons{position:fixed;z-index:5;bottom:9px;left:50%;transform:translateX(-50%);display:flex;gap:8px;white-space:nowrap}button{color:#fff;background:rgba(0,0,0,.5);border:1px solid rgba(255,255,255,.3);border-radius:22px;padding:8px 13px;font-size:13px;backdrop-filter:blur(8px)}
@media(orientation:portrait){.digit{width:9vw;height:11vw;font-size:10vw}.sep{font-size:9vw}.group{gap:2px}.panel{width:96vw}}
</style>
</head>
<body>
<img id="bg" src="morning.jpg" alt=""><div class="shade"></div><div id="sky"></div>
<main><section class="panel">
<div class="title"><span id="icon">☼</span> LIVE DIGITAL CLOCK</div>
<div class="time"><div class="group" id="h"></div><div class="sep">:</div><div class="group" id="m"></div><div class="sep">:</div><div class="group" id="s"></div></div>
<div class="ampm" id="ap"></div><div class="date" id="date"></div><div class="day" id="day"></div><div class="zone">INDIA • IST</div>
</section></main>
<div class="buttons">
<button id="orient">↔ Horizontal</button><button id="full">⛶ Fullscreen</button><button id="awake">☀ Keep Awake</button>
</div>
<script>
const q=id=>document.getElementById(id);let last={h:"",m:"",s:""};let portrait=false;
function group(el,v,old){el.innerHTML="";[...v].forEach((x,i)=>{let d=document.createElement("span");d.className="digit";d.textContent=x;if(!old||x!==old[i])d.classList.add("flip");el.appendChild(d)})}
function setWallpaper(src){if(q("bg").getAttribute("src")!==src){q("bg").style.opacity=0;q("bg").ontransitionend=()=>{q("bg").src=src;q("bg").style.opacity=1};q("bg").src=src;q("bg").style.opacity=1}}
function update(){
 const n=new Date();let H=n.getHours(),M=n.getMinutes(),S=n.getSeconds(),ap=H>=12?"PM":"AM";H=H%12||12;
 let h=String(H).padStart(2,"0"),m=String(M).padStart(2,"0"),s=String(S).padStart(2,"0");
 group(q("h"),h,last.h);group(q("m"),m,last.m);group(q("s"),s,last.s);last={h,m,s};
 q("ap").textContent=ap;q("date").textContent=n.toLocaleDateString("en-IN",{day:"numeric",month:"long",year:"numeric"});q("day").textContent=n.toLocaleDateString("en-IN",{weekday:"long"});
 let t=n.getHours()+n.getMinutes()/60,sky=q("sky");
 if(t>=5&&t<12){setWallpaper("morning.jpg");sky.className="sun";sky.style.opacity=1;q("icon").textContent="☼"}
 else if(t<17){setWallpaper("morning.jpg");sky.className="sun";sky.style.opacity=1;q("icon").textContent="☀"}
 else if(t<19.5){setWallpaper("night.jpg");sky.className="sun";sky.style.opacity=.65;q("icon").textContent="◒"}
 else{setWallpaper("night.jpg");sky.className="moon";sky.style.opacity=1;q("icon").textContent="☾"}
}
function tick(){update();setTimeout(tick,1005-Date.now()%1000)}tick();
q("orient").onclick=()=>{portrait=!portrait;document.documentElement.style.setProperty("--dummy","0");q("orient").textContent=portrait?"↕ Vertical":"↔ Horizontal";screen.orientation?.lock?.(portrait?"portrait":"landscape").catch(()=>{});};
q("full").onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen?.();
q("awake").onclick=async()=>{try{await navigator.wakeLock.request("screen");q("awake").textContent="✓ Keep Awake"}catch(e){}};
</script><script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./service-worker.js");
  });
}
</body>
</html>
