<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#050505">
<title>Live Digital Clock</title>
<style>
*{box-sizing:border-box} html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Arial,Helvetica,sans-serif}
body{background:#050505;color:#fff}
#bg{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;z-index:-3;transition:filter 2s,transform 8s}
.overlay{position:fixed;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.20),rgba(0,0,0,.42) 55%,rgba(0,0,0,.72));z-index:-2}
.sky{position:fixed;inset:0;pointer-events:none;z-index:-1;overflow:hidden}
.sun,.moon{position:absolute;border-radius:50%;transition:all 2s ease;opacity:0}
.sun{width:95px;height:95px;right:9%;top:10%;background:#ffd75a;box-shadow:0 0 35px 12px rgba(255,200,60,.55)}
.moon{width:78px;height:78px;right:10%;top:11%;background:#f4f0cf;box-shadow:0 0 25px 8px rgba(220,230,255,.25)}
.moon:after{content:"";position:absolute;width:72px;height:72px;border-radius:50%;background:#777;left:-20px;top:-7px}
.wrap{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px}
.badge{font-size:14px;letter-spacing:4px;font-weight:700;text-transform:uppercase;text-shadow:0 2px 12px #000;margin-bottom:14px;opacity:.92}
.time{font-variant-numeric:tabular-nums;font-weight:800;letter-spacing:2px;font-size:clamp(55px,15vw,150px);line-height:.95;text-shadow:0 3px 25px rgba(0,0,0,.9),0 0 18px rgba(255,255,255,.18)}
.ampm{font-size:clamp(18px,4vw,32px);letter-spacing:3px;margin-top:14px;font-weight:700;text-shadow:0 2px 12px #000}
.date{font-size:clamp(18px,4vw,30px);font-weight:600;margin-top:22px;text-shadow:0 2px 12px #000}
.day{font-size:clamp(22px,5vw,38px);font-weight:800;margin-top:7px;text-shadow:0 2px 14px #000}
.zone{margin-top:14px;font-size:13px;letter-spacing:3px;opacity:.9;text-shadow:0 2px 10px #000}
.controls{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);display:flex;gap:8px;opacity:.75}
button{border:1px solid rgba(255,255,255,.35);background:rgba(0,0,0,.35);color:#fff;border-radius:20px;padding:8px 13px;backdrop-filter:blur(8px)}
@media(max-width:600px){.sun{width:65px;height:65px}.moon{width:56px;height:56px}.moon:after{width:52px;height:52px}.controls{bottom:10px}}
</style>
</head>
<body>
<img id="bg" src="background1.jpg" alt="">
<div class="overlay"></div>
<div class="sky"><div class="sun" id="sun"></div><div class="moon" id="moon"></div></div>

<main class="wrap">
  <div class="badge" id="icon">☀️ LIVE DIGITAL CLOCK</div>
  <div class="time" id="time">00:00:00</div>
  <div class="ampm" id="ampm">AM</div>
  <div class="date" id="date">1 September 2026</div>
  <div class="day" id="day">Tuesday</div>
  <div class="zone">🇮🇳 INDIA • IST</div>
</main>

<div class="controls">
  <button onclick="prevBg()">‹</button>
  <button onclick="nextBg()">Background</button>
  <button onclick="toggleFull()">⛶</button>
  <button onclick="nextBg()">›</button>
</div>

<script>
const backgrounds = ["background1.jpg","background2.jpg","background3.jpg"];
let bgIndex=0;
const bg=document.getElementById("bg"), sun=document.getElementById("sun"), moon=document.getElementById("moon");

function updateClock(){
  const now=new Date();
  let h=now.getHours(), m=now.getMinutes(), s=now.getSeconds();
  const ap=h>=12?"PM":"AM";
  h=h%12||12;
  document.getElementById("time").textContent =
    String(h).padStart(2,"0")+":"+String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
  document.getElementById("ampm").textContent=ap;
  document.getElementById("date").textContent=now.toLocaleDateString("en-IN",{day:"numeric",month:"long",year:"numeric"});
  document.getElementById("day").textContent=now.toLocaleDateString("en-IN",{weekday:"long"});

  const hour=now.getHours()+now.getMinutes()/60;
  let icon="☀️";
  if(hour>=5 && hour<7){icon="🌅"; sun.style.opacity=1; moon.style.opacity=0;}
  else if(hour>=7 && hour<17){icon="☀️"; sun.style.opacity=1; moon.style.opacity=0;}
  else if(hour>=17 && hour<19.5){icon="🌇"; sun.style.opacity=.65; moon.style.opacity=0;}
  else {icon="🌙"; sun.style.opacity=0; moon.style.opacity=1;}
  document.getElementById("icon").textContent=icon+" LIVE DIGITAL CLOCK";
}
function setBg(){bg.src=backgrounds[bgIndex];}
function nextBg(){bgIndex=(bgIndex+1)%backgrounds.length;setBg();}
function prevBg(){bgIndex=(bgIndex-1+backgrounds.length)%backgrounds.length;setBg();}
function toggleFull(){
  if(!document.fullscreenElement) document.documentElement.requestFullscreen?.();
  else document.exitFullscreen?.();
}
updateClock(); setInterval(updateClock,1000);
setInterval(nextBg,15000);
</script>
</body>
</html>
